openapi: 3.1.0
info:
  title: Graffiticode API
  version: 1.0.0
  summary: Make interactive content from a plain-English description.
  description: |
    Graffiticode turns a natural-language description into interactive
    content — quizzes and assessment items, flashcards, spreadsheets, charts,
    surveys, concept webs and more — each made by a specialist language.

    The usual flow:

    1. `GET /languages` to find the language for the job (or pass your best
       guess: the platform re-routes a request another language fits better).
    2. `POST /items` with a description. Generation runs asynchronously: the
       response is `202 Accepted` with a `Location`.
    3. `GET /items/{id}` (with `Prefer: wait=N` to long-poll) until `status` is
       `ready`, then open its `view_url`.
    4. `POST /items/{id}/revisions` to change it by describing the change.

    Descriptions must be written in English; content inside an item may be in
    any language.

    Errors are `application/problem+json` (RFC 9457). A problem's `type` is
    `https://openapi.graffiticode.org/problems/<code>`.
  contact:
    name: Graffiticode
    url: https://graffiticode.org
servers:
  - url: https://openapi.graffiticode.org/v1
security:
  - {}
  - bearerAuth: []
  - oauth2: [graffiticode]
  - workspaceToken: []
tags:
  - name: languages
    description: The catalog of Graffiticode languages.
  - name: items
    description: The content you make.
  - name: account
    description: Workspaces and your account.
  - name: skills
    description: Agent skills — guidance for working with Graffiticode well.
  - name: meta
    description: This API's own description and health.

paths:
  /languages:
    get:
      operationId: list_languages
      tags: [languages]
      summary: List languages
      description: |
        The languages an agent should choose from, most relevant first when
        `search` is given. Internal and retired languages are not listed, but
        remain usable by id.
      parameters:
        - name: search
          in: query
          description: Words describing what you want to make.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: domain
          in: query
          description: Only languages in this domain (e.g. `assessment`).
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of languages.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguagePage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /languages/{id}:
    parameters:
      - $ref: "#/components/parameters/languageId"
    get:
      operationId: get_language_info
      tags: [languages]
      summary: Get a language
      description: How to author for a language, what it is for, and what it is not for.
      responses:
        "200":
          description: The language.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageInfo" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /languages/{id}/guide:
    parameters:
      - $ref: "#/components/parameters/languageId"
    get:
      operationId: get_language_guide
      tags: [languages]
      summary: Get a language's user guide
      description: The full authoring reference for a language, as markdown.
      responses:
        "200":
          description: The guide.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            text/markdown:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /skills:
    get:
      operationId: list_skills
      tags: [skills]
      summary: List agent skills
      description: Guidance for agents working with Graffiticode, read from the public graffiticode-app repository (packages/skills).
      responses:
        "200":
          description: The skills.
          headers:
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /skills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" }
    get:
      operationId: get_skill
      tags: [skills]
      summary: Get an agent skill
      responses:
        "200":
          description: The skill, as markdown.
          headers:
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            text/markdown:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /items:
    get:
      operationId: list_items
      tags: [items]
      summary: List your items
      description: Newest first. On the free plan, the items in your workspace.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      parameters:
        - name: language
          in: query
          schema: { $ref: "#/components/schemas/LanguageIdParam" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ItemStatus" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: create_item
      tags: [items]
      summary: Create an item
      description: |
        Starts generating an item from a description. Returns `202` at once,
        with the item (`status: generating`) and its `Location`; poll that
        (`Prefer: wait=N`) or follow its events until `ready`.

        To put several items in the same free-plan workspace, pass the previous
        item's id as `source_item_id`. When that moves you to another
        workspace, the new handle is in the `Graffiticode-Workspace` header.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Generating" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/LimitReached" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /items/{id}:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: get_item
      tags: [items]
      summary: Get an item
      description: |
        `status` is `generating`, `ready` or `failed`. While generating, send
        `Prefer: wait=N` (N ≤ 45) to wait up to N seconds for it to finish.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      parameters:
        - name: Prefer
          in: header
          description: "`wait=N`, N seconds (0–45), per RFC 7240."
          schema: { type: string, maxLength: 200 }
        - name: include
          in: query
          description: Also return the item's `src` and/or compiled `data` (comma-separated).
          schema: { type: string, pattern: "^(src|data)(,(src|data))?$" }
      responses:
        "200":
          description: The item.
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
            Preference-Applied: { $ref: "#/components/headers/Preference-Applied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
    patch:
      operationId: rename_item
      tags: [items]
      summary: Rename an item
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ItemPatch" }
          application/json:
            schema: { $ref: "#/components/schemas/ItemPatch" }
      responses:
        "200":
          description: The renamed item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archive_item
      tags: [items]
      summary: Archive an item
      description: A soft delete — the item leaves your listings; its id keeps working.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "204": { description: "Archived." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/itemId"
    post:
      operationId: update_item
      tags: [items]
      summary: Revise an item
      description: |
        Changes an item by describing the change. Returns `202`; follow the
        item as for a create. Refused with `409` while it is still generating.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionRequest" }
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Generating" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/LimitReached" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: list_revisions
      tags: [items]
      summary: List an item's versions
      description: Each content state the item has had, newest first. Needs a full account.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /items/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/itemId"
    post:
      operationId: retry_item
      tags: [items]
      summary: Retry a failed generation
      description: For an item whose `error.retryable` is true. Starts the same change again.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Generating" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /items/{id}/src:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: get_item_src
      tags: [items]
      summary: Get an item's source
      description: The program, in the item's language. Private to that language — to move content to another language, use `/spec`.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "200":
          description: The source.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{id}/data:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: get_item_data
      tags: [items]
      summary: Get an item's compiled data
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "200":
          description: The compiled data.
          content:
            application/json:
              schema: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{id}/spec:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: get_spec
      tags: [items]
      summary: Get an item's platform-neutral spec
      description: |
        A plain-English description of the item's content. To make it into
        another language, pass this text after one line of intent as a new
        item's description. It starts with a blank line on purpose: that keeps
        the content separate from your request however you join them.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "200":
          description: The spec.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spec" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /items/{id}/view:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: render_item
      tags: [items]
      summary: Open an item
      description: Redirects to the item's interactive view.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "303":
          description: See the view.
          headers:
            Location: { schema: { type: string, format: uri } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/embed:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: embed_item
      tags: [items]
      summary: Embed an item
      description: An oEmbed (`rich`) response with an iframe for the item's view.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      parameters:
        - name: maxwidth
          in: query
          schema: { type: integer, minimum: 200, maximum: 4000 }
        - name: maxheight
          in: query
          schema: { type: integer, minimum: 200, maximum: 4000 }
      responses:
        "200":
          description: The embed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Embed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{id}/events:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: item_events
      tags: [items]
      summary: Follow an item's generation
      description: |
        Server-sent events: `progress` while generating, then one `ready`
        (with the item) or `failed` (with the error), after which the stream
        ends. A comment is sent every 15 seconds to keep the connection open.
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces:
    post:
      operationId: create_workspace
      tags: [account]
      summary: Start a free-plan workspace
      description: |
        No account needed. Returns a workspace token to send as
        `X-Graffiticode-Workspace`; items you make with it are kept for 48
        hours, and its `claim_url`s let you keep them by signing up.
      security: [{}]
      responses:
        "201":
          description: A new workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  /me:
    get:
      operationId: get_me
      tags: [account]
      summary: Who you are, and what you have left
      security: [{ bearerAuth: [] }, { oauth2: [graffiticode] }, { workspaceToken: [] }]
      responses:
        "200":
          description: Your account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /openapi.json:
    get:
      operationId: get_openapi_json
      tags: [meta]
      summary: This description, as JSON
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema: { type: object }

  /openapi.yaml:
    get:
      operationId: get_openapi_yaml
      tags: [meta]
      summary: This description, as YAML
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /docs:
    get:
      operationId: get_docs
      tags: [meta]
      summary: Interactive documentation
      responses:
        "200":
          description: An HTML page rendering this description.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Graffiticode API key, created in the console under Settings.
    oauth2:
      type: oauth2
      description: |
        Sign in with a Graffiticode account (authorization code with PKCE).
        Clients register at https://mcp.graffiticode.org/oauth/register
        (RFC 7591); tokens are issued for the resource
        https://openapi.graffiticode.org/v1, named in the authorization URL.
      flows:
        authorizationCode:
          authorizationUrl: https://mcp.graffiticode.org/oauth/authorize?resource=https%3A%2F%2Fopenapi.graffiticode.org%2Fv1
          tokenUrl: https://mcp.graffiticode.org/oauth/token
          refreshUrl: https://mcp.graffiticode.org/oauth/token
          scopes:
            graffiticode: Create and edit your items.
    workspaceToken:
      type: apiKey
      in: header
      name: X-Graffiticode-Workspace
      description: |
        A free-plan workspace, from `POST /workspaces`. Send it back on every
        request; when the platform moves you to another workspace the new
        handle comes back in the `Graffiticode-Workspace` response header.

  parameters:
    languageId:
      name: id
      in: path
      required: true
      description: A language id such as `L0180` (the `L` is optional).
      schema: { type: string, pattern: "^[Ll]?[0-9]{4}$" }
    limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes retrying this request safe: the same key (within 24 hours) gets
        the original response — marked `Idempotent-Replayed: true` — and never
        a second item or generation.
      schema: { type: string, pattern: "^[\\x21-\\x7e]{1,255}$" }
    itemId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    cursor:
      name: cursor
      in: query
      description: Opaque; from a previous page's `next_cursor`.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,512}$" }

  headers:
    ETag:
      description: Entity tag for conditional requests (`If-None-Match`).
      schema: { type: string }
    Cache-Control:
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before checking again.
      schema: { type: integer }
    Preference-Applied:
      schema: { type: string }
    Graffiticode-Workspace:
      description: Your free-plan workspace handle, when it changed. Send it as `X-Graffiticode-Workspace` from now on.
      schema: { type: string }

  responses:
    NotModified:
      description: Unchanged since the `If-None-Match` tag.
    Generating:
      description: Accepted; generating. Follow `Location`.
      headers:
        Idempotent-Replayed:
          description: Present (`true`) when this is the stored response to an earlier request with the same `Idempotency-Key`.
          schema: { type: string }
        Location: { schema: { type: string } }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        Graffiticode-Workspace: { $ref: "#/components/headers/Graffiticode-Workspace" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Item" }
    Unauthorized:
      description: Credentials are missing or not valid.
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Not allowed for this account (for example, a full-account feature on the free plan).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    LimitReached:
      description: A plan limit was reached; `upgrade_url` says how to go on.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many requests; retry after `Retry-After` seconds.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        The item can't take this now: `generation_in_progress` (retry after
        `Retry-After`), `item_changed`, `not_ready`, or `not_retryable`.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyKeyReused:
      description: This `Idempotency-Key` was already used for a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: A free-plan item past its time limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request doesn't match this description.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Temporarily unavailable; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Stable machine-readable reason." }
        errors:
          type: array
          description: For validation problems, where the request failed.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: { type: string, description: "JSON pointer into the request." }
              message: { type: string }
      additionalProperties: true

    Language:
      type: object
      required: [id, name, description, domains]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^L[0-9]{4}$", examples: [L0180] }
        name: { type: string }
        description: { type: string }
        when_to_use: { type: string }
        domains:
          type: array
          items: { type: string }

    LanguagePage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null on the last.

    ExamplePrompt:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        produces: { type: string }
        notes: { type: string }

    LanguageInfo:
      type: object
      required: [id, name, description, domains, authoring_guide, supported_item_types, not_for, example_prompts, guide_url, spec_url]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^L[0-9]{4}$" }
        name: { type: string }
        description: { type: string }
        when_to_use: { type: string }
        domains:
          type: array
          items: { type: string }
        authoring_guide: { type: [string, "null"] }
        supported_item_types:
          type: array
          items: { type: string }
        not_for:
          type: array
          description: What this language is not for — the strongest signal to pick another.
          items: { type: string }
        example_prompts:
          type: array
          items: { $ref: "#/components/schemas/ExamplePrompt" }
        guide_url: { type: string, format: uri, description: "The full user guide (markdown)." }
        spec_url: { type: string, format: uri }

    Skill:
      type: object
      required: [id, name, description, url]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }

    LanguageIdParam:
      type: string
      pattern: "^[Ll]?[0-9]{4}$"

    ItemStatus:
      type: string
      enum: [generating, ready, failed]

    CreateItemRequest:
      type: object
      required: [language, description]
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/LanguageIdParam"
        description:
          type: string
          minLength: 1
          maxLength: 20000
          description: What to make, in English. Be specific about content, structure and look.
        name: { type: string, minLength: 1, maxLength: 200 }
        source_item_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: An item you made earlier, so this one joins its free-plan workspace.

    RevisionRequest:
      type: object
      required: [modification]
      additionalProperties: false
      properties:
        modification:
          type: string
          minLength: 1
          maxLength: 20000
          description: What to change, in English.

    ItemPatch:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    ItemError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: [string, "null"] }
        retryable: { type: boolean, description: "True when `POST /items/{id}/retry` can start it again." }

    LastWrite:
      type: object
      description: The latest write of this item's content to your connected item bank (read-only).
      required: [task_id, connection_id, status, at, checkable]
      properties:
        task_id: { type: string }
        connection_id: { type: [string, "null"] }
        status: { type: string, enum: [ok, failed, skipped] }
        message: { type: [string, "null"] }
        at: { type: string, format: date-time }
        confirmed: { type: [boolean, "null"] }
        checkable: { type: boolean }
        reconcile:
          type: [object, "null"]
          properties:
            verdict: { type: string }
            text: { type: string }
            at: { type: string, format: date-time }

    Item:
      type: object
      required: [id, name, language, status, created, updated, view_url, links]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        language: { type: string, pattern: "^L[0-9]{4}$" }
        status: { $ref: "#/components/schemas/ItemStatus" }
        error: { $ref: "#/components/schemas/ItemError" }
        progress:
          type: object
          description: While generating.
          properties:
            chars: { type: integer }
            elapsed_s: { type: integer }
        created: { type: [string, "null"], format: date-time }
        updated: { type: [string, "null"], format: date-time }
        view_url: { type: [string, "null"], format: uri, description: "Where to open the item, once ready." }
        claim_url:
          type: string
          format: uri
          description: Free plan — sign up and keep this workspace's items.
        last_write: { $ref: "#/components/schemas/LastWrite" }
        src: { type: string, description: "With `include=src`." }
        data: { description: "With `include=data`." }
        links:
          type: object
          required: [self, view, spec, events, revisions]
          properties:
            self: { type: string, format: uri }
            view: { type: string, format: uri }
            spec: { type: string, format: uri }
            events: { type: string, format: uri }
            revisions: { type: string, format: uri }

    ItemPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        next_cursor: { type: [string, "null"] }

    Revision:
      type: object
      required: [task_id, created, source]
      properties:
        task_id: { type: string }
        created: { type: string, format: date-time }
        source: { type: string }
        label: { type: [string, "null"] }

    Spec:
      type: object
      required: [item_id, language, spec, coverage_checked, coverage_missing]
      additionalProperties: false
      properties:
        item_id: { type: string }
        language: { type: string, pattern: "^L[0-9]{4}$" }
        spec: { type: string }
        coverage_checked: { type: integer, description: "Source strings checked for in the spec." }
        coverage_missing:
          type: array
          description: Source strings the spec left out.
          items: { type: string }

    Embed:
      type: object
      required: [version, type, html, width, height]
      properties:
        version: { const: "1.0" }
        type: { const: rich }
        title: { type: string }
        provider_name: { type: string }
        provider_url: { type: string }
        html: { type: string }
        width: { type: integer }
        height: { type: integer }

    Workspace:
      type: object
      required: [workspace, expires_at]
      properties:
        workspace: { type: string, description: "Send as `X-Graffiticode-Workspace`." }
        expires_at: { type: string, format: date-time }
        usage: { type: string }

    Me:
      type: object
      required: [account]
      properties:
        account: { type: string, enum: [user, free_plan] }
        plan:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        usage:
          type: object
          properties:
            items_this_period: { type: integer }
            included_items: { type: [integer, "null"] }
            available_items: { type: [integer, "null"], description: "Null when uncapped." }
            period_ends_at: { type: [string, "null"], format: date-time }
        free_plan:
          type: object
          properties:
            item_ttl_hours: { type: integer }
            languages:
              type: array
              items: { type: string }
            signup_url: { type: string, format: uri }
