name: skills

# packages/skills is live content: the MCP server and the REST API read it from
# this repository's default branch at request time, so a merged skill edit
# reaches every connected client within minutes, with no build or deploy. There
# is no staging environment to catch a bad skill — these jobs are it. (Moved
# from the graffiticode-skills repository with the skills, 2026-10-16.)
on:
  push:
    branches: [main]
    paths: ["packages/skills/**", ".github/workflows/skills.yml"]
  pull_request:
    paths: ["packages/skills/**", ".github/workflows/skills.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/skills

jobs:
  validate:
    name: validate (pre-deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/skills/package-lock.json
      - run: npm ci
      - run: npm run validate

  package:
    name: package (dry-run + determinism)
    # The ZIP uploaded to OpenAI is built from a commit, so a skill edit that
    # would break packaging — a new top-level dir, an over-cap description, a
    # dot-prefixed name — must fail on the PR rather than at the portal.
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --ref resolves against real history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/skills/package-lock.json
      - run: npm ci
      # Two independent processes must agree on the artifact hash. Separate
      # processes are the point: an in-process double build would hide
      # Date.now(), iteration-order and tmpdir nondeterminism.
      - name: build twice and compare
        run: |
          a=$(npm run --silent package -- --dry-run --no-fetch --ref ${{ github.sha }} | grep -o 'sha256  [0-9a-f]*')
          b=$(npm run --silent package -- --dry-run --no-fetch --ref ${{ github.sha }} | grep -o 'sha256  [0-9a-f]*')
          echo "$a"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "NOT DETERMINISTIC: $a vs $b"; exit 1; }

  smoke:
    name: smoke (post-deploy)
    # Only meaningful once the commit is on the default branch — that is what the
    # servers serve. On a PR there is nothing deployed to compare against.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/skills/package-lock.json
      - run: npm ci
      # Polls until the live server matches this commit. Measured propagation is
      # ~3.5 min — the ~60s cache TTL is the small term, raw-CDN is the big one.
      - run: npm run smoke
        env:
          SMOKE_TIMEOUT_MS: 420000
