# mcp-service. Built from the repo root (gc-deploy snapshots the whole tree).
# Build stage: install the mcp-server workspace (incl. devDependencies: tsc and
# esbuild) and build dist/, including the widget bundles under dist/widget.
FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 AS build
WORKDIR /usr/src/app
COPY . .
RUN npm ci -w packages/mcp-server && npm run build:mcp

FROM node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 AS runtime
WORKDIR /usr/src/app
ENV NODE_ENV=production
# npm ci validates the root lockfile against every workspace manifest, so the
# console manifest comes along; none of its code or dependencies do.
COPY package.json package-lock.json .npmrc ./
COPY packages/console/package.json packages/console/package.json
COPY packages/mcp-server packages/mcp-server
COPY --from=build /usr/src/app/packages/mcp-server/dist packages/mcp-server/dist
RUN npm ci --omit=dev -w packages/mcp-server

WORKDIR /usr/src/app/packages/mcp-server
EXPOSE 3001
CMD [ "node", "dist/server.js" ]
