# console. Built from the repo root (gc-deploy snapshots the whole tree).
FROM node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 AS build
RUN apk add --no-cache libc6-compat
WORKDIR /app
# NEXT_PUBLIC_* values are inlined into the client bundle at build time. They
# can't come from packages/console/.env.production: gc-deploy's snapshot and
# .dockerignore both drop .env* files. Keep in sync with that file, which
# local builds still read. Public values only; never put a secret here.
ENV NEXT_PUBLIC_PRIVY_APP_ID=cmom2ijrw00040cl4hd9qvjnq
COPY . .
RUN npm ci -w packages/console -w packages/core && npm run build:console

FROM node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 AS runtime
WORKDIR /app
ENV NODE_ENV=production
RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 nextjs

# outputFileTracingRoot is the repo root, so the standalone tree mirrors the
# monorepo layout and the server lives at packages/console/server.js.
COPY --from=build --chown=nextjs:nodejs /app/packages/console/.next/standalone ./
COPY --from=build --chown=nextjs:nodejs /app/packages/console/.next/static ./packages/console/.next/static
COPY --from=build /app/packages/console/public ./packages/console/public

USER nextjs
# Same cwd-relative layout as the pre-monorepo image (cwd held server.js).
WORKDIR /app/packages/console
ENV PORT=8080 HOSTNAME=0.0.0.0
EXPOSE 8080
CMD ["node", "server.js"]
