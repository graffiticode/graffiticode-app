# openapi-service: the Graffiticode REST API. Built from the repo root
# (gc-deploy snapshots the whole tree), on the mcp image's pattern.
FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 AS build
WORKDIR /usr/src/app
COPY . .
RUN npm ci -w packages/openapi-server -w packages/core && npm run build:core && npm run build:openapi

FROM node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 AS runtime
WORKDIR /usr/src/app
ENV NODE_ENV=production
# npm ci validates the root lockfile against every workspace manifest, so the
# other manifests come along; none of their code or dependencies do.
COPY package.json package-lock.json .npmrc ./
COPY packages/console/package.json packages/console/package.json
COPY packages/mcp-server/package.json packages/mcp-server/package.json
COPY packages/core/package.json packages/core/package.json
COPY packages/openapi-server/package.json packages/openapi-server/openapi.yaml packages/openapi-server/
COPY --from=build /usr/src/app/packages/core/dist packages/core/dist
COPY --from=build /usr/src/app/packages/openapi-server/dist packages/openapi-server/dist
RUN npm ci --omit=dev -w packages/openapi-server -w packages/core

WORKDIR /usr/src/app/packages/openapi-server
USER node
EXPOSE 8080
CMD [ "node", "dist/server.js" ]
